name: Release

on:
  push:
    tags: ['v*']
  # Manual runs build the tarball and the Pi image without cutting a tag or
  # publishing a release. Used to iterate on the image build.
  #
  # `rebuild_from_tag` re-cuts the image for a release that already shipped,
  # using that release's published tarball instead of building the app again.
  # The point is to fix a bad image without touching the app: the payload is
  # the same bytes users already downloaded, while the OS layer comes from the
  # stage scripts in this checkout. Skips the build job, so it runs in minutes.
  #
  # A rebuilt image is not a reproduction of the original: apt packages and the
  # stage scripts are today's, and `setup-system` still comes from the old
  # tarball. Fixes that live in image-creation/ therefore apply, and fixes that
  # live in scripts/upgrade.sh do not.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string for artifact names (e.g. v1.2.3-test)'
        required: false
        type: string
      rebuild_from_tag:
        description: 'Re-cut the image for an existing release, e.g. v1.11.0 (skips the app build)'
        required: false
        type: string
      attach:
        description: 'Upload the rebuilt image to that release, replacing any image already there'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    # A rebuild takes its payload from an already-published release, so there is
    # nothing to compile. The image job handles the skip. Nightly tags belong to
    # the Nightly workflow, which publishes them without a Pi image.
    if: ${{ (inputs.rebuild_from_tag || '') == '' && !contains(github.ref_name, '-dev.') }}
    uses: ./.github/workflows/build-tarball.yml
    with:
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

  publish:
    name: Publish release
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-dev.') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: standalone-tarball
          path: .

      - name: Check for release notes
        id: notes
        run: |
          NOTES_FILE="RELEASE_NOTES/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "path=${NOTES_FILE}" >> "$GITHUB_OUTPUT"
          fi

      # A release candidate is a prerelease on GitHub, which keeps it out of
      # releases/latest; the app's "Early access" choice finds it by its tag.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.5.0
        with:
          files: |
            home-screens-*.tar.gz
            home-screens-*.tar.gz.sha256
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  image:
    name: Build Pi image
    needs: [build, publish]
    # `always()` so a rebuild still runs with the build and publish jobs
    # skipped. Guard on both results explicitly: a genuinely failed build
    # must not be imaged, and a failed release publish must not spend two
    # hours producing an image, and a checklist telling someone to promote
    # it, for a release that does not exist.
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') && (needs.publish.result == 'success' || needs.publish.result == 'skipped') && !contains(github.ref_name, '-dev.') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # The build job owns this on the normal path, but it is skipped on a
      # rebuild, so the image job resolves its own version either way.
      - name: Resolve version
        id: version
        run: |
          REBUILD="${{ inputs.rebuild_from_tag }}"
          if [ -n "${REBUILD}" ]; then
            VERSION="${REBUILD}"
          else
            VERSION="${{ needs.build.outputs.version }}"
          fi
          if [ -z "${VERSION}" ]; then
            echo "::error::Set either 'version' or 'rebuild_from_tag'"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            parted dosfstools e2fsprogs zerofree xz-utils curl

      # A 6GiB work image plus the extracted base plus the compressed output
      # does not fit alongside the runner's preinstalled toolchains.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache
          df -h /

      - name: Download tarball
        if: ${{ (inputs.rebuild_from_tag || '') == '' }}
        uses: actions/download-artifact@v4
        with:
          name: standalone-tarball
          path: .

      # Rebuild path: the artifact from the original run is long expired
      # (retention-days: 1), but the release asset is permanent and is the
      # exact payload users downloaded, checksum included.
      - name: Download tarball from release
        if: ${{ (inputs.rebuild_from_tag || '') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.rebuild_from_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern 'home-screens-*.tar.gz' \
            --pattern 'home-screens-*.tar.gz.sha256'

      # The base OS image is ~1.3GB and pinned in the builder. Key on the
      # builder's hash so bumping the pin invalidates the cache.
      - name: Cache base image
        uses: actions/cache@v4
        with:
          path: image-creation/.cache/base
          key: rpios-base-${{ hashFiles('image-creation/build-image-ci.sh') }}

      - name: Build image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TARBALL="home-screens-${VERSION}.tar.gz"
          SHA="$(awk '{print $1}' "${TARBALL}.sha256")"
          sudo ./image-creation/build-image-ci.sh \
            --version "${VERSION}" \
            --target pi5 \
            --tarball "${TARBALL}" \
            --tarball-sha256 "${SHA}"

      # The image is held here, not attached to the release. A green build
      # proves the filesystem, not the device: two images shipped with a kiosk
      # that never started and a sudo grant that was missing, and every finalize
      # check had passed. Publication is the promote-image workflow, run by a
      # person after the checklist in the job summary passes on real hardware,
      # against this exact artifact. 30 days is long enough to test and short
      # enough that an untested image cannot linger and get promoted by mistake.
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-image
          path: |
            image-creation/out/*.img.xz
            image-creation/out/*.img.xz.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Publish the acceptance checklist
        if: ${{ (inputs.rebuild_from_tag || '') == '' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## Pi image built, not published"
            echo
            echo "Download the \`pi-image\` artifact from this run, flash it, and run every line below on a real Pi with a screen attached. Then publish it with the **Promote Pi image** workflow using run id \`${GITHUB_RUN_ID}\` and tag \`${VERSION}\`."
            echo
            echo "- [ ] First boot reaches the kiosk on HDMI (no black screen, no login prompt)"
            echo "- [ ] Second boot: nothing re-runs, the wall comes back on its own"
            echo "- [ ] Ethernet boot, then Settings > Network lists WiFi networks and joins one"
            echo "- [ ] Fresh flash with wifi.txt joins the network; a wrong password leaves a fixable state (new wifi.txt on the card replaces it)"
            echo "- [ ] A settings change in the editor survives a reboot"
            echo "- [ ] \`ssh hs@home-screens.local\` with password \`screens\` works; \`sudo -k -n true\` succeeds"
            echo "- [ ] Settings > System: update to the previous release and back to this one"
            echo "- [ ] Pull power during the install step of an update; the wall comes back on the next boot"
          } >> "$GITHUB_STEP_SUMMARY"

      # A rebuild may attach directly with `attach`, because its payload is a
      # release that already shipped and the operator asked for it by name.
      # --clobber because the whole point is replacing an image that shipped
      # broken. Leave `attach` off to run the checklist first and promote
      # through the promote-image workflow like any other build.
      - name: Attach rebuilt image to its release
        if: ${{ (inputs.rebuild_from_tag || '') != '' && inputs.attach }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.rebuild_from_tag }}" \
            image-creation/out/*.img.xz \
            image-creation/out/*.img.xz.sha256 \
            --repo "${{ github.repository }}" --clobber
