name: Release

on:
  push:
    tags: ['v*']
  # Manual runs build the tarball and the Pi image without cutting a tag or
  # publishing a release. Used to iterate on the image build.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string for artifact names (e.g. v1.2.3-test)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      # Node 22 bundles npm 10; raise it to the engines floor in package.json.
      - run: |
          npm install -g "npm@$(node -p 'require("./package.json").engines.npm' | tr -d '>=^~ ')"

      - run: npm ci

      - run: npm run build

      # Assemble standalone tarball
      - name: Assemble tarball
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          cp -r scripts .next/standalone/scripts
          cp .node-version .next/standalone/.node-version

          # Bundle the config-check CLI so `npm run config:check` works on
          # installs with no dev dependencies or src/ tree. The launcher
          # (scripts/check-config.mjs) prefers this artifact when present.
          npx esbuild scripts/check-config.ts --bundle --platform=node \
            --format=cjs --outfile=.next/standalone/scripts/check-config.cjs

          # Seed config for fresh installs (data/config.json is gitignored)
          mkdir -p .next/standalone/data
          node -e "
            const seed = {
              version: 1,
              settings: {
                rotationIntervalMs: 30000,
                displayWidth: 1080,
                displayHeight: 1920,
                latitude: 0, longitude: 0,
                weather: { provider: 'weatherapi', latitude: 0, longitude: 0, units: 'imperial' },
                calendar: { googleCalendarId: '', googleCalendarIds: [], maxEvents: 10, daysAhead: 7 }
              },
              screens: [{ id: 'default', name: 'Screen 1', backgroundImage: '', modules: [] }]
            };
            require('fs').writeFileSync('.next/standalone/data/config.json', JSON.stringify(seed, null, 2));
          "

          # package.json with corrected start script for tarball root
          node -e "
            const pkg = require('./package.json');
            pkg.scripts.start = 'node server.js';
            require('fs').writeFileSync(
              '.next/standalone/package.json',
              JSON.stringify(pkg, null, 2)
            );
          "

          TAG="${{ steps.version.outputs.version }}"
          tar -czf "home-screens-${TAG}.tar.gz" -C .next/standalone .

      # Generate SHA-256 sidecar for artifact integrity verification.
      # install.sh and upgrade.sh download this alongside the tarball and
      # verify before extraction. Closes the gap where HTTPS provides
      # transport integrity but not artifact integrity (compromised GitHub
      # account or replaced asset would otherwise go undetected).
      - name: Compute checksum
        run: |
          TAG="${{ steps.version.outputs.version }}"
          sha256sum "home-screens-${TAG}.tar.gz" > "home-screens-${TAG}.tar.gz.sha256"
          cat "home-screens-${TAG}.tar.gz.sha256"

      # Fail if tarball exceeds 60MB
      - name: Size gate
        run: |
          size=$(stat -c%s home-screens-*.tar.gz)
          echo "Tarball size: $(( size / 1024 / 1024 ))MB ($size bytes)"
          if [ "$size" -gt 62914560 ]; then
            echo "::error::Tarball exceeds 60MB budget"
            exit 1
          fi

      # Hand the tarball to the image job. It installs this exact artifact
      # rather than rebuilding, so the image contains the same bytes users
      # download and the same bytes the checksum above covers.
      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-tarball
          path: |
            home-screens-*.tar.gz
            home-screens-*.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error

      - name: Check for release notes
        id: notes
        run: |
          NOTES_FILE="RELEASE_NOTES/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "path=${NOTES_FILE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2.5.0
        with:
          files: |
            home-screens-*.tar.gz
            home-screens-*.tar.gz.sha256
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  image:
    name: Build Pi image
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            parted dosfstools e2fsprogs zerofree xz-utils curl

      # A 6GiB work image plus the extracted base plus the compressed output
      # does not fit alongside the runner's preinstalled toolchains.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache
          df -h /

      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: standalone-tarball
          path: .

      # The base OS image is ~1.3GB and pinned in the builder. Key on the
      # builder's hash so bumping the pin invalidates the cache.
      - name: Cache base image
        uses: actions/cache@v4
        with:
          path: image-creation/.cache/base
          key: rpios-base-${{ hashFiles('image-creation/build-image-ci.sh') }}

      - name: Build image
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          TARBALL="home-screens-${VERSION}.tar.gz"
          SHA="$(awk '{print $1}' "${TARBALL}.sha256")"
          sudo ./image-creation/build-image-ci.sh \
            --version "${VERSION}" \
            --target pi5 \
            --tarball "${TARBALL}" \
            --tarball-sha256 "${SHA}"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-image
          path: |
            image-creation/out/*.img.xz
            image-creation/out/*.img.xz.sha256
          if-no-files-found: error

      # Adds the image to the release the build job already created. Assets are
      # added, not replaced, so the tarball published above survives.
      - name: Attach image to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2.5.0
        with:
          files: |
            image-creation/out/*.img.xz
            image-creation/out/*.img.xz.sha256
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
