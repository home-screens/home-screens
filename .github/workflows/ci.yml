name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      # Node 22 bundles npm 10; raise it to the engines floor in package.json.
      - run: |
          npm install -g "npm@$(node -p 'require("./package.json").engines.npm' | tr -d '>=^~ ')"

      - run: npm ci

      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      # Node 22 bundles npm 10; raise it to the engines floor in package.json.
      - run: |
          npm install -g "npm@$(node -p 'require("./package.json").engines.npm' | tr -d '>=^~ ')"

      - run: npm ci

      - run: npm test

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      # Node 22 bundles npm 10; raise it to the engines floor in package.json.
      - run: |
          npm install -g "npm@$(node -p 'require("./package.json").engines.npm' | tr -d '>=^~ ')"

      - run: npm ci

      - run: npx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      # Node 22 bundles npm 10; raise it to the engines floor in package.json.
      - run: |
          npm install -g "npm@$(node -p 'require("./package.json").engines.npm' | tr -d '>=^~ ')"

      - run: npm ci

      - run: npm run build

  e2e:
    name: E2E (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 6 shards keep per-shard wall time in the pre-expansion envelope: the
        # suite grew from ~390 to ~950 tests when the coverage ratchets landed.
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      # Node 22 bundles npm 10; raise it to the engines floor in package.json.
      - run: |
          npm install -g "npm@$(node -p 'require("./package.json").engines.npm' | tr -d '>=^~ ')"

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run build

      # Each shard runs its slice and emits a blob report; the merge job below
      # stitches them into one HTML report. Chromium-only, data/ isolation is
      # unchanged (each worker still boots its own sandboxed server).
      - run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=blob

      - uses: actions/upload-artifact@v4
        if: '!cancelled()'
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  e2e-report:
    name: E2E report
    if: '!cancelled()'
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      # Node 22 bundles npm 10; raise it to the engines floor in package.json.
      - run: |
          npm install -g "npm@$(node -p 'require("./package.json").engines.npm' | tr -d '>=^~ ')"

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - run: npx playwright merge-reports --reporter html ./all-blob-reports

      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci --prefix website

      - run: npm --prefix website run typecheck

      - run: npm --prefix website run build
